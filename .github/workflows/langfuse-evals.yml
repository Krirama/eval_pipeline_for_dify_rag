name: Langfuse Evals

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install requests pyyaml

    - name: Run Dify Evaluation
      env:
        DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
      run: |
        python - <<'EOF'
        import json
        import requests
        import yaml
        import os
        import sys

        # ==================== CONFIG ====================
        CONFIG_PATH = "configs/thresholds.yaml"
        DATASET_PATH = "datasets/golden_dataset.json"

        # Load threshold
        try:
            with open(CONFIG_PATH, "r") as f:
                config = yaml.safe_load(f)
            threshold = float(config.get("hallucination_score", 0.85))
            print(f"✅ Loaded hallucination threshold: {threshold}")
        except Exception as e:
            print(f"❌ Failed to load threshold: {e}")
            sys.exit(1)
        EOF

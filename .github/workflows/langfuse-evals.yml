name: Langfuse Evals Pipeline

on:
  push:
    paths:
      - 'prompts/**'
      - 'prompots/**'      # Added to handle your current folder name
      - 'configs/**'
      - 'datasets/**'

jobs:
  test-dify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run Dify Evaluation
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
        run: |
          python - <<'EOF'
import json
import requests
import yaml
import os
import sys

# ====================== CONFIG ======================
CONFIG_PATH = "configs/thresholds.yaml"
DATASET_PATH = "datasets/golden_dataset.json"

# Load threshold
try:
    with open(CONFIG_PATH, "r") as f:
        config = yaml.safe_load(f)
    threshold = float(config.get("hallucination_score", 0.85))
    print(f"✅ Loaded hallucination threshold: {threshold}")
except Exception as e:
    print(f"❌ Failed to load threshold: {e}")
    sys.exit(1)

# Load dataset
try:
    with open(DATASET_PATH, "r") as f:
        dataset = json.load(f)
    print(f"✅ Loaded {len(dataset)} test cases")
except Exception as e:
    print(f"❌ Failed to load dataset: {e}")
    sys.exit(1)

# ====================== TEST LOOP ======================
all_passed = True

for i, item in enumerate(dataset):
    question = item.get("question")
    expected_behavior = item.get("expected_behavior", "")
    
    print(f"\n🔍 Test Case {i+1}: {question}")

    headers = {
        "Authorization": f"Bearer {os.getenv('DIFY_API_KEY')}",
        "Content-Type": "application/json"
    }

    payload = {
        "inputs": {},
        "query": question,
        "response_mode": "blocking",
        "user": "ci-test"
    }

    try:
        response = requests.post(
            "https://api.dify.ai/v1/chat-messages",
            headers=headers,
            json=payload,
            timeout=60
        )

        if response.status_code != 200:
            print(f"❌ API Error {response.status_code}: {response.text[:300]}")
            all_passed = False
            continue

        result = response.json()
        answer = result.get("answer", "")

        print("📝 Answer:", answer[:400] + "..." if len(answer) > 400 else answer)

        # TODO: Replace with real Langfuse / LLM judge later
        # Simple placeholder check for now
        if len(answer.strip()) < 20:
            print("⚠️  Warning: Very short response")
            all_passed = False

    except Exception as e:
        print(f"❌ Request failed: {e}")
        all_passed = False

# Final result
if all_passed:
    print("\n✅ All tests passed!")
    sys.exit(0)
else:
    print("\n❌ Some tests failed")
    sys.exit(1)
EOF

name: Langfuse Evals Pipeline

on:
  push:
    paths:
      - 'prompts/**'
      - 'configs/**'
      - 'datasets/**'

jobs:
  test-dify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Call Dify API
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
        run: |
          python - <<'EOF'
import json
import requests
import os
import sys

# Load golden dataset
try:
    with open("datasets/golden_dataset.json", "r") as f:
        dataset = json.load(f)
    
    if not dataset:
        print("❌ Dataset is empty")
        sys.exit(1)
        
    question = dataset[0].get("question")
    expected_answer = dataset[0].get("answer", "")
    print("🔍 Testing question:", question)
    
except Exception as e:
    print(f"❌ Failed to load dataset: {e}")
    sys.exit(1)

# Prepare headers
headers = {
    "Authorization": f"Bearer {os.getenv('DIFY_API_KEY')}",
    "Content-Type": "application/json"
}

payload = {
    "inputs": {},
    "query": question,
    "response_mode": "blocking",
    "user": "ci-test"
}

try:
    response = requests.post(
        "https://api.dify.ai/v1/chat-messages",
        headers=headers,
        json=payload,
        timeout=60
    )
    
    print("📡 Status Code:", response.status_code)
    
    if response.status_code != 200:
        print("❌ API Error:", response.text)
        sys.exit(1)
    
    result = response.json()
    answer = result.get("answer", "")
    print("✅ Dify Response received")
    print("📝 Answer:", answer[:500] + "..." if len(answer) > 500 else answer)
    
    # TODO: Add Langfuse evaluation here later
    
except requests.exceptions.RequestException as e:
    print(f"❌ Request failed: {e}")
    sys.exit(1)
EOF
